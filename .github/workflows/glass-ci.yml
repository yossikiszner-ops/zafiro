name: Zafiro Glass CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "feat/zafiro-glass-v2", "feat/zafiro-complete-upgrade", "feat/zafiro-1.6-integration" ]
permissions:
  contents: read

concurrency:
  group: glass-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :agent-runtime:testPythonRuntime --stacktrace
      - name: Python updater regression fixtures
        run: |
          python3 -m pip install 'pytest==8.3.5'
          python3 -m pytest app/src/test/python -q
      - name: Record JVM test totals
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, pathlib, xml.etree.ElementTree as ET
          reports = []
          for path in glob.glob("**/build/test-results/testDebugUnitTest/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              reports.append({key: int(root.get(key, 0)) for key in ("tests", "failures", "errors", "skipped")})
              for line in root.findtext("system-out", "").splitlines():
                  if line.startswith("LOCAL_ROUTER_BENCHMARK "):
                      print(line)
          total = {key: sum(report[key] for report in reports) for key in ("tests", "failures", "errors", "skipped")}
          pathlib.Path("validation-summary.json").write_text(json.dumps(total, indent=2))
          print("JVM_TEST_TOTALS " + json.dumps(total, sort_keys=True))
          PY
      - name: Detect configured release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p packing
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > packing/nexus_release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No configured release signing key; debug artifact only."
          fi
      - name: Compile signed custom APK
        if: steps.signing.outputs.available == 'true'
        env:
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PRELEASE_STORE_PASSWORD="$STORE_PW" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PW"
      - name: Upload signed custom APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-signed-custom-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            validation-summary.json
          if-no-files-found: ignore
