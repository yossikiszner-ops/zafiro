name: Zafiro Glass CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "feat/zafiro-glass-v2" ]
permissions:
  contents: read

concurrency:
  group: glass-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :agent-runtime:testPythonRuntime --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
